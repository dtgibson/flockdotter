name: DotCounter
options:
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
configs:
  Debug: debug
  Release: release
  OwnerBeta: release
  PublicStore: release
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    INFOPLIST_KEY_CFBundleShortVersionString: '$(MARKETING_VERSION)'
    INFOPLIST_KEY_CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    'EXCLUDED_SOURCE_FILE_NAMES[config=Release]': 'QA-flock.jpg BirdPrototype'
    'EXCLUDED_SOURCE_FILE_NAMES[config=OwnerBeta]': 'QA-flock.jpg'
    'EXCLUDED_SOURCE_FILE_NAMES[config=PublicStore]': 'QA-flock.jpg'
  configs:
    PublicStore:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) PUBLIC_STORE'
      CURRENT_PROJECT_VERSION: '9'
    OwnerBeta:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) OWNER_BETA'
      CURRENT_PROJECT_VERSION: '3'
packages:
  DotCounterCore:
    path: Packages/DotCounterCore
targets:
  DotCounterMac:
    type: application
    platform: macOS
    sources:
      - DotCounter/Shared
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: docs/public/privacy.md
        buildPhase: resources
      - path: docs/public/support.md
        buildPhase: resources
      - DotCounter/macOS
      - path: DotCounter/Resources
        excludes: [BirdPrototype]
        buildPhase: resources
      - path: DotCounter/Resources/BirdPrototype
        type: folder
        buildPhase: resources
    dependencies:
      - package: DotCounterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dotcounter.mac
        PRODUCT_NAME: DotCounter
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DotCounter/Configuration/macOS-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Flock Dotter
        INFOPLIST_KEY_CFBundleName: Flock Dotter
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        CODE_SIGN_ENTITLEMENTS: DotCounter/macOS/DotCounter.entitlements
  DotCounterIOS:
    type: application
    platform: iOS
    sources:
      - DotCounter/Shared
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: docs/public/privacy.md
        buildPhase: resources
      - path: docs/public/support.md
        buildPhase: resources
      - DotCounter/iOS
      - path: DotCounter/Resources
        excludes: [BirdPrototype]
        buildPhase: resources
      - path: DotCounter/Resources/BirdPrototype
        type: folder
        buildPhase: resources
    dependencies:
      - package: DotCounterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dotcounter.ios
        PRODUCT_NAME: DotCounter
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_FILE: DotCounter/Configuration/iOS-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Flock Dotter
        INFOPLIST_KEY_CFBundleName: Flock Dotter
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
      configs:
        Release:
          'CODE_SIGNING_ALLOWED[sdk=iphoneos*]': YES
        OwnerBeta:
          'CODE_SIGNING_ALLOWED[sdk=iphoneos*]': YES
  DotCounterMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - DotCounterUITests
    dependencies:
      - target: DotCounterMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dotcounter.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DotCounterMac
  DotCounterIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DotCounterUITests
    dependencies:
      - target: DotCounterIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dotcounter.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DotCounterIOS
        TARGETED_DEVICE_FAMILY: '1,2'
  DotCounterIOSRegressionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DotCounterRegressionTests
    dependencies:
      - target: DotCounterIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dotcounter.ios.regressiontests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/DotCounter.app/DotCounter'
        BUNDLE_LOADER: '$(TEST_HOST)'
  DotCounterOwnerBetaRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DotCounterOwnerBetaRuntimeTests
    dependencies:
      - target: DotCounterIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dotcounter.ios.ownerbetaruntimetests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/DotCounter.app/DotCounter'
        BUNDLE_LOADER: '$(TEST_HOST)'

schemes:
  DotCounterMac:
    build:
      targets:
        DotCounterMac: all
    test:
      targets:
        - DotCounterMacUITests
  DotCounterIOS:
    build:
      targets:
        DotCounterIOS: all
    test:
      targets:
        - DotCounterIOSUITests
        - DotCounterIOSRegressionTests

  DotCounterOwnerBetaMac:
    build:
      targets:
        DotCounterMac: all
    run:
      config: OwnerBeta
    profile:
      config: OwnerBeta
    analyze:
      config: OwnerBeta
    archive:
      config: OwnerBeta

  DotCounterOwnerBetaIOS:
    build:
      targets:
        DotCounterIOS: all
    test:
      config: OwnerBeta
      targets:
        - DotCounterOwnerBetaRuntimeTests
    run:
      config: OwnerBeta
    profile:
      config: OwnerBeta
    analyze:
      config: OwnerBeta
    archive:
      config: OwnerBeta

  DotCounterPublicStoreIOS:
    build:
      targets:
        DotCounterIOS: all
    run:
      config: PublicStore
    profile:
      config: PublicStore
    analyze:
      config: PublicStore
    archive:
      config: PublicStore
